<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - BookMyShow</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <a href="/"><h1>Book<span>MyShow</span></h1></a>
      </div>
      
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to continue booking</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" 
                 id="email" 
                 name="email" 
                 class="form-control" 
                 placeholder="Enter your email"
                 required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" 
                 id="password" 
                 name="password" 
                 class="form-control" 
                 placeholder="Enter your password"
                 required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Sign In
        </button>
      </form>
      
      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (API.auth.isLoggedIn()) {
        window.location.href = API.auth.isAdmin() ? '/admin-dashboard.html' : '/user-dashboard.html';
        return;
      }
      
      // Handle login form
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');
        
        if (!email || !password) {
          Utils.showToast('Please fill in all fields', 'error');
          return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Signing in...';
        
        try {
          await API.auth.login(email, password);
          Utils.showToast('Login successful!', 'success');
          
          setTimeout(() => {
            if (API.auth.isAdmin()) {
              window.location.href = '/admin-dashboard.html';
            } else {
              window.location.href = '/user-dashboard.html';
            }
          }, 500);
        } catch (error) {
          Utils.showToast(error.message || 'Login failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
