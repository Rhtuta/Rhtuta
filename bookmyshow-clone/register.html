<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - BookMyShow</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <a href="/"><h1>Book<span>MyShow</span></h1></a>
      </div>
      
      <h2>Create Account</h2>
      <p class="subtitle">Join us to start booking</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" 
                 id="name" 
                 name="name" 
                 class="form-control" 
                 placeholder="Enter your full name"
                 required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" 
                 id="email" 
                 name="email" 
                 class="form-control" 
                 placeholder="Enter your email"
                 required>
        </div>
        
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" 
                 id="phoneNumber" 
                 name="phoneNumber" 
                 class="form-control" 
                 placeholder="Enter your phone number"
                 required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" 
                 id="password" 
                 name="password" 
                 class="form-control" 
                 placeholder="Create a password (min 6 characters)"
                 required
                 minlength="6">
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" 
                 id="confirmPassword" 
                 name="confirmPassword" 
                 class="form-control" 
                 placeholder="Confirm your password"
                 required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create Account
        </button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (API.auth.isLoggedIn()) {
        window.location.href = '/user-dashboard.html';
        return;
      }
      
      // Handle register form
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');
        
        // Validations
        if (!name || !email || !phoneNumber || !password || !confirmPassword) {
          Utils.showToast('Please fill in all fields', 'error');
          return;
        }
        
        if (!Utils.isValidEmail(email)) {
          Utils.showToast('Please enter a valid email', 'error');
          return;
        }
        
        if (!Utils.isValidPhone(phoneNumber)) {
          Utils.showToast('Please enter a valid 10-digit phone number', 'error');
          return;
        }
        
        if (password.length < 6) {
          Utils.showToast('Password must be at least 6 characters', 'error');
          return;
        }
        
        if (password !== confirmPassword) {
          Utils.showToast('Passwords do not match', 'error');
          return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Creating account...';
        
        try {
          await API.auth.register({ name, email, phoneNumber, password });
          Utils.showToast('Registration successful! Please login.', 'success');
          
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } catch (error) {
          Utils.showToast(error.message || 'Registration failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
