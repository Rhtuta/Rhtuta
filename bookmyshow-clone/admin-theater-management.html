<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theater Management - BookMyShow Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="logo">Book<span>MyShow</span></div>
      
      <nav class="admin-nav">
        <a href="/admin-dashboard.html">📊 Dashboard</a>
        <a href="/admin-movie-management.html">🎬 Movies</a>
        <a href="/admin-theater-management.html" class="active">🏢 Theaters</a>
        <a href="/admin-screen-management.html">📺 Screens</a>
        <a href="/admin-seat-management.html">💺 Seats</a>
        <a href="/admin-show-management.html">🎭 Shows</a>
        <a href="/admin-booking-view.html">🎟️ Bookings</a>
        <a href="/admin-users-view.html">👥 Users</a>
        <div class="dropdown-divider"></div>
        <a href="/user-dashboard.html">👤 My Profile</a>
        <a href="#" id="logout-btn">🚪 Logout</a>
      </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-content">
      <div class="admin-header">
        <h1>Theater Management</h1>
        <button class="btn btn-primary" onclick="openAddTheaterModal()">
          + Add Theater
        </button>
      </div>
      
      <!-- Theaters Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>All Theaters</h3>
          <div class="flex gap-2">
            <select class="form-control" id="city-filter" style="width: 150px;">
              <option value="">All Cities</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Delhi">Delhi</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Chennai">Chennai</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Kolkata">Kolkata</option>
              <option value="Pune">Pune</option>
            </select>
          </div>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>City</th>
              <th>Address</th>
              <th>Max Screens Allowed</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="theaters-table">
            <tr>
              <td colspan="6" class="text-center">
                <div class="spinner" style="margin: 20px auto;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  
  <!-- Add/Edit Theater Modal -->
  <div class="modal-overlay" id="theater-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="theater-modal-title">Add Theater</h3>
        <button class="modal-close" onclick="Utils.closeModal('theater-modal')">&times;</button>
      </div>
      <form id="theater-form">
        <div class="modal-body">
          <input type="hidden" id="theater-id">
          
          <div class="form-group">
            <label for="theater-name">Name *</label>
            <input type="text" id="theater-name" name="name" class="form-control" required>
          </div>
          
          <div class="form-group">
            <label for="theater-city">City *</label>
            <select id="theater-city" name="city" class="form-control" required>
              <option value="">Select City</option>
              <option value="Delhi">Delhi</option>
              <option value="Yamunanagar">Yamunanagar</option>
              <option value="Faridabad">Faridabad</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Chennai">Chennai</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Kolkata">Kolkata</option>
              <option value="Pune">Pune</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="theater-address">Address *</label>
            <textarea id="theater-address" name="address" class="form-control" rows="2" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="theater-screens">Total Screens *</label>
            <input type="number" id="theater-screens" name="totalScreens" class="form-control" required min="1">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('theater-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Theater</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let allTheaters = [];
    
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Utils.requireAuth()) return;
      if (!Utils.requireAdmin()) return;
      
      await loadTheaters();
      setupFilters();
      setupForm();
    });
    
    async function loadTheaters() {
      try {
        allTheaters = await API.theaters.getAll();
        renderTheaters(allTheaters);
      } catch (error) {
        console.error('Failed to load theaters:', error);
        document.getElementById('theaters-table').innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-danger">Failed to load theaters</td>
          </tr>
        `;
      }
    }
    
    function renderTheaters(theaters) {
      const tbody = document.getElementById('theaters-table');
      
      if (!theaters || theaters.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-gray">No theaters found</td>
          </tr>
        `;
        return;
      }
      
      tbody.innerHTML = theaters.map(theater => `
        <tr>
          <td>${theater.id}</td>
          <td><strong>${Utils.escapeHtml(theater.name)}</strong></td>
          <td>${Utils.escapeHtml(theater.city || '-')}</td>
          <td>${Utils.escapeHtml(theater.address || '-')}</td>
          <td>${theater.totalScreens || 0}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn edit" onclick="editTheater(${theater.id})" title="Edit">✏️</button>
              <button class="action-btn delete" onclick="deleteTheater(${theater.id})" title="Delete">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }
    
    function setupFilters() {
      document.getElementById('city-filter').addEventListener('change', (e) => {
        const city = e.target.value.toLowerCase();
        if (!city) {
          renderTheaters(allTheaters);
        } else {
          const filtered = allTheaters.filter(t => t.city?.toLowerCase() === city);
          renderTheaters(filtered);
        }
      });
    }
    
    function setupForm() {
      document.getElementById('theater-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const theaterId = document.getElementById('theater-id').value;
        const theaterData = {
          name: document.getElementById('theater-name').value.trim(),
          city: document.getElementById('theater-city').value,
          address: document.getElementById('theater-address').value.trim(),
          totalScreens: parseInt(document.getElementById('theater-screens').value)
        };
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Saving...';
        
        try {
          if (theaterId) {
            await API.theaters.update(theaterId, theaterData);
            Utils.showToast('Theater updated successfully', 'success');
          } else {
            await API.theaters.create(theaterData);
            Utils.showToast('Theater created successfully', 'success');
          }
          
          Utils.closeModal('theater-modal');
          await loadTheaters();
        } catch (error) {
          Utils.showToast(error.message || 'Failed to save theater', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Theater';
        }
      });
    }
    
    function openAddTheaterModal() {
      document.getElementById('theater-modal-title').textContent = 'Add Theater';
      document.getElementById('theater-form').reset();
      document.getElementById('theater-id').value = '';
      Utils.openModal('theater-modal');
    }
    
    async function editTheater(id) {
      try {
        const theater = await API.theaters.getById(id);
        
        document.getElementById('theater-modal-title').textContent = 'Edit Theater';
        document.getElementById('theater-id').value = theater.id;
        document.getElementById('theater-name').value = theater.name || '';
        document.getElementById('theater-city').value = theater.city || '';
        document.getElementById('theater-address').value = theater.address || '';
        document.getElementById('theater-screens').value = theater.totalScreens || 1;
        
        Utils.openModal('theater-modal');
      } catch (error) {
        Utils.showToast('Failed to load theater details', 'error');
      }
    }
    
    async function deleteTheater(id) {
      const confirmed = await Utils.confirm(
        'Are you sure you want to delete this theater? All associated screens and shows will also be affected.',
        'Delete Theater'
      );
      
      if (!confirmed) return;
      
      try {
        await API.theaters.delete(id);
        Utils.showToast('Theater deleted successfully', 'success');
        await loadTheaters();
      } catch (error) {
        Utils.showToast(error.message || 'Failed to delete theater', 'error');
      }
    }
  </script>
</body>
</html>
