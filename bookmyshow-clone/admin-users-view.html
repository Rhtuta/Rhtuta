<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - BookMyShow Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="logo">Book<span>MyShow</span></div>
      
      <nav class="admin-nav">
        <a href="/admin-dashboard.html">📊 Dashboard</a>
        <a href="/admin-movie-management.html">🎬 Movies</a>
        <a href="/admin-theater-management.html">🏢 Theaters</a>
        <a href="/admin-screen-management.html">📺 Screens</a>
        <a href="/admin-seat-management.html">💺 Seats</a>
        <a href="/admin-show-management.html">🎭 Shows</a>
        <a href="/admin-booking-view.html">🎟️ Bookings</a>
        <a href="/admin-users-view.html" class="active">👥 Users</a>
        <div class="dropdown-divider"></div>
        <a href="/user-dashboard.html">👤 My Profile</a>
        <a href="#" id="logout-btn">🚪 Logout</a>
      </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-content">
      <div class="admin-header">
        <h1>User Management</h1>
      </div>
      
      <!-- Users Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>All Users</h3>
          <div class="flex gap-2">
            <input type="text" class="form-control" id="search-users" 
                   placeholder="Search users..." style="width: 250px;">
            <select class="form-control" id="role-filter" style="width: 150px;">
              <option value="">All Roles</option>
              <option value="ADMIN">Admin</option>
              <option value="USER">User</option>
            </select>
          </div>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table">
            <tr>
              <td colspan="6" class="text-center">
                <div class="spinner" style="margin: 20px auto;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let allUsers = [];
    
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Utils.requireAuth()) return;
      if (!Utils.requireAdmin()) return;
      
      await loadUsers();
      setupFilters();
    });
    
    async function loadUsers() {
      try {
        allUsers = await API.users.getAll();
        renderUsers(allUsers);
      } catch (error) {
        console.error('Failed to load users:', error);
        document.getElementById('users-table').innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-danger">Failed to load users</td>
          </tr>
        `;
      }
    }
    
    function renderUsers(users) {
      const tbody = document.getElementById('users-table');
      
      if (!users || users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-gray">No users found</td>
          </tr>
        `;
        return;
      }
      
      tbody.innerHTML = users.map(user => `
        <tr>
          <td>${user.id}</td>
          <td><strong>${Utils.escapeHtml(user.name || 'N/A')}</strong></td>
          <td>${Utils.escapeHtml(user.email)}</td>
          <td>${Utils.escapeHtml(user.phoneNumber || 'N/A')}</td>
          <td><span class="status-badge ${user.role === 'ADMIN' ? 'confirmed' : 'pending'}">${user.role || 'USER'}</span></td>
          <td>
            <div class="action-btns">
              <button class="action-btn view" onclick="viewUserBookings(${user.id})" title="View Bookings">🎟️</button>
              <button class="action-btn delete" onclick="deleteUser(${user.id})" title="Delete">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }
    
    function setupFilters() {
      const searchInput = document.getElementById('search-users');
      const roleFilter = document.getElementById('role-filter');
      
      const applyFilters = () => {
        const search = searchInput.value.trim().toLowerCase();
        const role = roleFilter.value;
        
        let filtered = allUsers;
        
        if (search) {
          filtered = filtered.filter(u => 
            u.name?.toLowerCase().includes(search) ||
            u.email?.toLowerCase().includes(search) ||
            u.phoneNumber?.includes(search)
          );
        }
        
        if (role) {
          filtered = filtered.filter(u => u.role === role);
        }
        
        renderUsers(filtered);
      };
      
      searchInput.addEventListener('input', Utils.debounce(applyFilters, 300));
      roleFilter.addEventListener('change', applyFilters);
    }
    
    async function viewUserBookings(userId) {
      try {
        const bookings = await API.bookings.getByUser(userId);
        
        if (!bookings || bookings.length === 0) {
          Utils.showToast('This user has no bookings', 'info');
          return;
        }
        
        const details = bookings.map(b => 
          `• ${b.bookingNumber}: ${b.show?.movie?.title || 'N/A'} - ${b.status}`
        ).join('\n');
        
        alert(`User Bookings (${bookings.length}):\n\n${details}`);
      } catch (error) {
        Utils.showToast('Failed to load user bookings', 'error');
      }
    }
    
    async function deleteUser(id) {
      const confirmed = await Utils.confirm(
        'Are you sure you want to delete this user? All their bookings will also be affected.',
        'Delete User'
      );
      
      if (!confirmed) return;
      
      try {
        await API.users.delete(id);
        Utils.showToast('User deleted successfully', 'success');
        await loadUsers();
      } catch (error) {
        Utils.showToast(error.message || 'Failed to delete user', 'error');
      }
    }
  </script>
</body>
</html>
