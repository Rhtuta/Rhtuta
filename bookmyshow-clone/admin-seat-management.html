<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Management - BookMyShow Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="logo">Book<span>MyShow</span></div>

      <nav class="admin-nav">
        <a href="/admin-dashboard.html">📊 Dashboard</a>
        <a href="/admin-movie-management.html">🎬 Movies</a>
        <a href="/admin-theater-management.html">🏢 Theaters</a>
        <a href="/admin-screen-management.html">📺 Screens</a>
        <a href="/admin-seat-management.html" class="active">💺 Seats</a>
        <a href="/admin-show-management.html">🎭 Shows</a>
        <a href="/admin-booking-view.html">🎟️ Bookings</a>
        <a href="/admin-users-view.html">👥 Users</a>
        <div class="dropdown-divider"></div>
        <a href="/user-dashboard.html">👤 My Profile</a>
        <a href="#" id="logout-btn">🚪 Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">

      <div class="admin-header">
        <h1>Seat Management</h1>
        <button class="btn btn-primary" onclick="openAddSeatModal()">
          + Add Seat
        </button>
      </div>

      <!-- Filters -->
      <div class="table-container mb-3">
        <div class="table-header">
          <h3>Seat Filters</h3>

          <div class="flex gap-2">
            <select class="form-control" id="theater-filter" style="width: 200px;">
              <option value="">All Theaters</option>
            </select>

            <select class="form-control" id="screen-filter" style="width: 200px;">
              <option value="">Select Screen</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Seats Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>All Seats</h3>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Seat Number</th>
              <th>Seat Type</th>
              <th>Base Price</th>
              <th>Screen</th>
              <th>Theater</th>
            </tr>
          </thead>

          <tbody id="seats-table">
            <tr>
              <td colspan="6" class="text-center">
                Select a screen to view seats
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Add Seat Modal -->
  <div class="modal-overlay" id="seat-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Seat</h3>
        <button class="modal-close" onclick="Utils.closeModal('seat-modal')">&times;</button>
      </div>

      <form id="seat-form">
        <div class="modal-body">

          <div class="form-group">
            <label>Screen *</label>
            <select id="seat-screen" class="form-control" required>
              <option value="">Select Screen</option>
            </select>
          </div>

          <div class="form-group">
            <label>Seat Number *</label>
            <input type="text" id="seat-number" class="form-control"
                   placeholder="e.g. A1, B2" required>
          </div>

          <div class="form-group">
            <label>Seat Type *</label>
            <select id="seat-type" class="form-control" required>
              <option value="">Select Type</option>
              <option value="REGULAR">Regular</option>
              <option value="PREMIUM">Premium</option>
              <option value="VIP">VIP</option>
              <option value="RECLINER">Recliner</option>
            </select>
          </div>

          <div class="form-group">
            <label>Base Price (₹) *</label>
            <input type="number" id="seat-price" class="form-control" required>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  onclick="Utils.closeModal('seat-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Seat</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let allTheaters = [];
    let allScreens = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!Utils.requireAuth()) return;
      if (!Utils.requireAdmin()) return;

      await loadTheaters();
      await loadScreens();
      setupFilters();
      setupForm();
    });

    // ================= THEATERS =================
    async function loadTheaters() {
      allTheaters = await API.theaters.getAll();

      document.getElementById('theater-filter').innerHTML = `
        <option value="">All Theaters</option>
        ${allTheaters.map(t => `
          <option value="${t.id}">${t.name} (${t.city})</option>
        `).join('')}
      `;
    }

    // ================= SCREENS =================
    async function loadScreens(theaterId = '') {
      const screens = theaterId
        ? await API.screens.getByTheater(theaterId)
        : await API.screens.getAll();

      allScreens = screens;

      const options = screens.map(s => `
        <option value="${s.id}">
          ${s.name} - ${s.theater?.name}
        </option>
      `).join('');

      document.getElementById('screen-filter').innerHTML =
        '<option value="">Select Screen</option>' + options;

      document.getElementById('seat-screen').innerHTML =
        '<option value="">Select Screen</option>' + options;
    }

    // ================= FILTERS =================
    function setupFilters() {
      document.getElementById('theater-filter').addEventListener('change', async (e) => {
        await loadScreens(e.target.value);

        document.getElementById('seats-table').innerHTML =
          `<tr><td colspan="6" class="text-center">Select a screen to view seats</td></tr>`;
      });

      document.getElementById('screen-filter').addEventListener('change', async (e) => {
        const screenId = e.target.value;

        if (!screenId) {
          document.getElementById('seats-table').innerHTML =
            `<tr><td colspan="6" class="text-center">Select a screen to view seats</td></tr>`;
          return;
        }

        const seats = await API.seats.getByScreen(screenId);
        renderSeats(seats, screenId);
      });
    }

    function renderSeats(seats, screenId) {
      const screen = allScreens.find(s => s.id == screenId);

      document.getElementById('seats-table').innerHTML = seats.map(seat => `
        <tr>
          <td>${seat.id}</td>
          <td><b>${seat.seatNumber}</b></td>
          <td>${seat.seatType}</td>
          <td>₹${seat.basePrice || 0}</td>
          <td>${screen?.name || '-'}</td>
          <td>${screen?.theater?.name || '-'}</td>
        </tr>
      `).join('');
    }

    // ================= LIVE DUPLICATE CHECK =================
    async function checkDuplicateSeat(screenId, seatNumber) {
      const seats = await API.seats.getByScreen(screenId);

      return seats.some(seat =>
        seat.seatNumber.toLowerCase() === seatNumber.toLowerCase()
      );
    }

    // ================= FORM =================
    function setupForm() {
      document.getElementById('seat-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const screenId = document.getElementById('seat-screen').value;
        const seatNumber = document.getElementById('seat-number').value.trim();

        const btn = e.target.querySelector('button[type="submit"]');

        btn.disabled = true;
        btn.textContent = "Checking...";

        try {
          // 🔥 LIVE CHECK FROM BACKEND
          const isDuplicate = await checkDuplicateSeat(screenId, seatNumber);

          if (isDuplicate) {
            Utils.showToast("Seat already exists in this screen!", "error");
            btn.disabled = false;
            btn.textContent = "Save Seat";
            return;
          }

          const seatData = {
            seatNumber,
            seatType: document.getElementById('seat-type').value,
            basePrice: parseFloat(document.getElementById('seat-price').value)
          };

          btn.textContent = "Saving...";

          await API.seats.create(screenId, seatData);

          Utils.showToast("Seat created successfully", "success");
          Utils.closeModal('seat-modal');
          document.getElementById('seat-form').reset();

          const currentScreen = document.getElementById('screen-filter').value;
          if (currentScreen == screenId) {
            const updatedSeats = await API.seats.getByScreen(screenId);
            renderSeats(updatedSeats, screenId);
          }

        } catch (err) {
          Utils.showToast(err.message || "Error creating seat", "error");
        }

        btn.disabled = false;
        btn.textContent = "Save Seat";
      });
    }

    function openAddSeatModal() {
      document.getElementById('seat-form').reset();
      Utils.openModal('seat-modal');
    }
  </script>

</body>
</html>
