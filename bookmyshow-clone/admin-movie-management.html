<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Management - BookMyShow Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="logo">Book<span>MyShow</span></div>
      
      <nav class="admin-nav">
        <a href="/admin-dashboard.html">📊 Dashboard</a>
        <a href="/admin-movie-management.html" class="active">🎬 Movies</a>
        <a href="/admin-theater-management.html">🏢 Theaters</a>
        <a href="/admin-screen-management.html">📺 Screens</a>
        <a href="/admin-seat-management.html">💺 Seats</a>
        <a href="/admin-show-management.html">🎭 Shows</a>
        <a href="/admin-booking-view.html">🎟️ Bookings</a>
        <a href="/admin-users-view.html">👥 Users</a>
        <div class="dropdown-divider"></div>
        <a href="/user-dashboard.html">👤 My Profile</a>
        <a href="#" id="logout-btn">🚪 Logout</a>
      </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-content">
      <div class="admin-header">
        <h1>Movie Management</h1>
        <button class="btn btn-primary" onclick="openAddMovieModal()">
          + Add Movie
        </button>
      </div>
      
      <!-- Movies Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>All Movies</h3>
          <div class="flex gap-2">
            <input type="text" class="form-control" id="search-movies" 
                   placeholder="Search movies..." style="width: 250px;">
          </div>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Poster</th>
              <th>Title</th>
              <th>Genre</th>
              <th>Language</th>
              <th>Duration</th>
              <th>Release Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="movies-table">
            <tr>
              <td colspan="7" class="text-center">
                <div class="spinner" style="margin: 20px auto;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  
  <!-- Add/Edit Movie Modal -->
  <div class="modal-overlay" id="movie-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="movie-modal-title">Add Movie</h3>
        <button class="modal-close" onclick="Utils.closeModal('movie-modal')">&times;</button>
      </div>
      <form id="movie-form">
        <div class="modal-body">
          <input type="hidden" id="movie-id">
          
          <div class="form-group">
            <label for="movie-title">Title *</label>
            <input type="text" id="movie-title" name="title" class="form-control" required>
          </div>
          
          <div class="form-group">
            <label for="movie-description">Description</label>
            <textarea id="movie-description" name="description" class="form-control" rows="3"></textarea>
          </div>
          
          <div class="flex gap-2">
            <div class="form-group" style="flex: 1;">
              <label for="movie-genre">Genre *</label>
              <select id="movie-genre" name="genre" class="form-control" required>
                <option value="">Select Genre</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Romance">Romance</option>
                <option value="Thriller">Thriller</option>
                <option value="Sci-Fi">Sci-Fi</option>
              </select>
            </div>
            
            <div class="form-group" style="flex: 1;">
              <label for="movie-language">Language *</label>
              <select id="movie-language" name="language" class="form-control" required>
                <option value="">Select Language</option>
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Tamil">Tamil</option>
                <option value="Telugu">Telugu</option>
                <option value="Malayalam">Malayalam</option>
                <option value="Kannada">Kannada</option>
              </select>
            </div>
          </div>
          
          <div class="flex gap-2">
            <div class="form-group" style="flex: 1;">
              <label for="movie-duration">Duration (mins) *</label>
              <input type="number" id="movie-duration" name="durationMins" class="form-control" required min="1">
            </div>
            
            <div class="form-group" style="flex: 1;">
              <label for="movie-release">Release Date</label>
              <input type="date" id="movie-release" name="releaseDate" class="form-control">
            </div>
          </div>
          
          <div class="form-group">
            <label for="movie-poster">Poster URL *</label>
            <input type="url" id="movie-poster" name="posterUrl" class="form-control" 
                   placeholder="[example.com](https://example.com/poster.jpg)" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('movie-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Movie</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let allMovies = [];
    
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Utils.requireAuth()) return;
      if (!Utils.requireAdmin()) return;
      
      await loadMovies();
      setupSearch();
      setupForm();
    });
    
    async function loadMovies() {
      try {
        allMovies = await API.movies.getAll();
        renderMovies(allMovies);
      } catch (error) {
        console.error('Failed to load movies:', error);
        document.getElementById('movies-table').innerHTML = `
          <tr>
            <td colspan="7" class="text-center text-danger">Failed to load movies</td>
          </tr>
        `;
      }
    }
    
    function renderMovies(movies) {
      const tbody = document.getElementById('movies-table');
      
      if (!movies || movies.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center text-gray">No movies found</td>
          </tr>
        `;
        return;
      }
      
      tbody.innerHTML = movies.map(movie => `
        <tr>
          <td>
        <img 
    src="${movie.posterUrl || 'https://via.placeholder.com/60x90?text=No+Poster'}"
    alt="${Utils.escapeHtml(movie.title)}"
    style="width: 60px; height: 90px; object-fit: cover; border-radius: var(--radius-sm);"
    onerror="this.onerror=null; this.src='https://via.placeholder.com/60x90?text=No+Poster';"
  >
          </td>
          <td><strong>${Utils.escapeHtml(movie.title)}</strong></td>
          <td>${Utils.escapeHtml(movie.genre || '-')}</td>
          <td>${Utils.escapeHtml(movie.language || '-')}</td>
          <td>${movie.durationMins ? Utils.formatDuration(movie.durationMins) : '-'}</td>
          <td>${movie.releaseDate ? Utils.formatDate(movie.releaseDate) : '-'}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn edit" onclick="editMovie(${movie.id})" title="Edit">✏️</button>
              <button class="action-btn delete" onclick="deleteMovie(${movie.id})" title="Delete">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }
    
    function setupSearch() {
      const searchInput = document.getElementById('search-movies');
      const debouncedSearch = Utils.debounce((value) => {
        const filtered = allMovies.filter(m => 
          m.title?.toLowerCase().includes(value.toLowerCase()) ||
          m.genre?.toLowerCase().includes(value.toLowerCase()) ||
          m.language?.toLowerCase().includes(value.toLowerCase())
        );
        renderMovies(filtered);
      }, 300);
      
      searchInput.addEventListener('input', (e) => debouncedSearch(e.target.value));
    }
    
    function setupForm() {
      document.getElementById('movie-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const movieId = document.getElementById('movie-id').value;
        const movieData = {
          title: document.getElementById('movie-title').value.trim(),
          description: document.getElementById('movie-description').value.trim(),
          genre: document.getElementById('movie-genre').value,
          language: document.getElementById('movie-language').value,
          durationMins: parseInt(document.getElementById('movie-duration').value),
          releaseDate: document.getElementById('movie-release').value || null,
          posterUrl: document.getElementById('movie-poster').value.trim()
        };
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Saving...';
        
        try {
          if (movieId) {
            await API.movies.update(movieId, movieData);
            Utils.showToast('Movie updated successfully', 'success');
          } else {
            await API.movies.create(movieData);
            Utils.showToast('Movie created successfully', 'success');
          }
          
          Utils.closeModal('movie-modal');
          await loadMovies();
        } catch (error) {
          Utils.showToast(error.message || 'Failed to save movie', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Movie';
        }
      });
    }
    
    function openAddMovieModal() {
      document.getElementById('movie-modal-title').textContent = 'Add Movie';
      document.getElementById('movie-form').reset();
      document.getElementById('movie-id').value = '';
      Utils.openModal('movie-modal');
    }
    
    async function editMovie(id) {
      try {
        const movie = await API.movies.getById(id);
        
        document.getElementById('movie-modal-title').textContent = 'Edit Movie';
        document.getElementById('movie-id').value = movie.id;
        document.getElementById('movie-title').value = movie.title || '';
        document.getElementById('movie-description').value = movie.description || '';
        document.getElementById('movie-genre').value = movie.genre || '';
        document.getElementById('movie-language').value = movie.language || '';
        document.getElementById('movie-duration').value = movie.durationMins || '';
        document.getElementById('movie-release').value = movie.releaseDate ? movie.releaseDate.split('T')[0] : '';
        document.getElementById('movie-poster').value = movie.posterUrl || '';
        
        Utils.openModal('movie-modal');
      } catch (error) {
        Utils.showToast('Failed to load movie details', 'error');
      }
    }
    
    async function deleteMovie(id) {
      const confirmed = await Utils.confirm(
        'Are you sure you want to delete this movie? This action cannot be undone.',
        'Delete Movie'
      );
      
      if (!confirmed) return;
      
      try {
        await API.movies.delete(id);
        Utils.showToast('Movie deleted successfully', 'success');
        await loadMovies();
      } catch (error) {
        Utils.showToast(error.message || 'Failed to delete movie', 'error');
      }
    }
  </script>
</body>
</html>
