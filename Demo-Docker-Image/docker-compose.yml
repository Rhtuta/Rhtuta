version: '3.8'

services:
  # --- Your Spring Boot Application Service ---
   app:
    build: .
    container_name: springboot-app
    ports:
      - "8080:8080"
    environment:
      # We use the MySQL service name 'mysql-db' as the hostname here
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3307/testdb?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=apppass
    depends_on:
      - mysql-db

  # --- MySQL Database Service ---
   mysql-db:
    image: mysql:8.0
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql



# --- Persistent Storage and Network Volumes ---
volumes:
  db-data:

