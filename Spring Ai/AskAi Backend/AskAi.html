<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask — AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBFE;
    --surface:#FFFFFF;
    --text:#1B1B27;
    --muted:#75758A;
    --border:#ECECF3;
    --accent-1:#5B5FEF;
    --accent-2:#8B5CF6;
    --accent-soft:#EEEDFD;
    --user-bubble:#5B5FEF;
    --shadow: 0 1px 2px rgba(20,20,43,0.04), 0 8px 24px -12px rgba(20,20,43,0.12);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* header */
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(251,251,254,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark{
    width:34px;height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px -4px rgba(91,95,239,0.55);
    flex-shrink:0;
  }
  .brand .mark svg{width:18px;height:18px;}
  .brand .wordmark{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  .brand .wordmark span{
    color:var(--accent-1);
  }

  /* main scroll area */
  main{
    flex:1;
    overflow-y:auto;
    display:flex;
    justify-content:center;
  }
  .thread{
    width:100%;
    max-width:720px;
    padding:28px 20px 140px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  /* empty state / hero */
  .hero{
    margin:auto;
    text-align:center;
    padding:40px 20px;
    max-width:440px;
  }
  .hero .mark{
    width:56px;height:56px;
    border-radius:16px;
    margin:0 auto 20px;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -6px rgba(91,95,239,0.5);
  }
  .hero .mark svg{width:28px;height:28px;}
  .hero h2{
    font-family:'Sora', sans-serif;
    font-size:22px;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .hero p{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 24px;
  }
  .suggestions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .suggestion{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .suggestion:hover{
    border-color:var(--accent-1);
    box-shadow:var(--shadow);
    transform:translateY(-1px);
  }

  /* messages */
  .msg{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .msg.user{
    flex-direction:row-reverse;
  }
  .avatar{
    width:30px;height:30px;
    border-radius:9px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    position:relative;
  }
  .avatar svg{width:16px;height:16px;}
  .avatar.thinking::after{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:12px;
    border:2px solid var(--accent-2);
    opacity:0.6;
    animation:pulse-ring 1.4s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{transform:scale(0.9); opacity:0.7;}
    100%{transform:scale(1.35); opacity:0;}
  }
  .msg.user .avatar{
    background:#E7E7EF;
  }
  .msg.user .avatar svg{color:var(--muted);}

  .bubble-col{
    max-width:78%;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .msg.user .bubble-col{align-items:flex-end;}

  .role-label{
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    padding:0 2px;
  }

  .bubble{
    font-size:15px;
    line-height:1.6;
    padding:12px 16px;
    border-radius:16px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.assistant .bubble{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-bottom-left-radius:4px;
    box-shadow:var(--shadow);
  }
  .msg.error .bubble{
    background:#FFF3F2;
    border:1px solid #FBD5D0;
    color:#B3261E;
    border-bottom-left-radius:4px;
  }

  .typing-dots{
    display:flex;
    gap:4px;
    padding:14px 16px;
  }
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    opacity:0.5;
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  /* composer */
  .composer-wrap{
    position:sticky;
    bottom:0;
    display:flex;
    justify-content:center;
    padding:16px 20px 22px;
    background:linear-gradient(180deg, rgba(251,251,254,0) 0%, var(--bg) 40%);
  }
  .composer{
    width:100%;
    max-width:720px;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 8px 8px 18px;
    box-shadow:var(--shadow);
  }
  textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-family:'Inter', sans-serif;
    font-size:15px;
    line-height:1.5;
    max-height:160px;
    padding:8px 0;
    background:transparent;
    color:var(--text);
  }
  textarea::placeholder{color:var(--muted);}

  .send-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s ease, filter .12s ease, opacity .15s;
    box-shadow:0 4px 12px -4px rgba(91,95,239,0.6);
  }
  .send-btn svg{width:16px;height:16px;color:#fff;}
  .send-btn:hover:not(:disabled){filter:brightness(1.08);}
  .send-btn:active:not(:disabled){transform:scale(0.94);}
  .send-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    box-shadow:none;
  }

  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    max-width:720px;
    margin:8px auto 0;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  @media (max-width:480px){
    .thread{padding:20px 14px 130px;}
    .bubble-col{max-width:86%;}
    .suggestions{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L14.2 9.2L21 12L14.2 14.8L12 22L9.8 14.8L3 12L9.8 9.2L12 2Z" fill="white"/>
      </svg>
    </div>
    <div class="wordmark">Ask<span>.</span></div>
  </div>
</header>

<main>
  <div class="thread" id="thread">
    <div class="hero" id="hero">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.2 9.2L21 12L14.2 14.8L12 22L9.8 14.8L3 12L9.8 9.2L12 2Z" fill="white"/>
        </svg>
      </div>
      <h2>Ask me anything</h2>
      <p>I'm connected to your AI backend — type a question below or try one of these.</p>
      <div class="suggestions">
        <div class="suggestion" data-q="Explain quantum computing in simple terms">Explain quantum computing simply</div>
        <div class="suggestion" data-q="Give me 3 tips to write cleaner code">3 tips for cleaner code</div>
        <div class="suggestion" data-q="What's a good name for a coffee shop?">Name my coffee shop</div>
        <div class="suggestion" data-q="Write a short poem about the ocean">Write an ocean poem</div>
      </div>
    </div>
  </div>
</main>

<div class="composer-wrap">
  <div style="width:100%; max-width:720px; margin:0 auto;">
    <div class="composer">
      <textarea id="question" placeholder="Message Ask…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12L19 12M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hint">Ask can make mistakes. Check important info.</div>
  </div>
</div>

<script>
  // Spring Boot backend running on port 8080.
  const API_BASE = 'http://localhost:8080/api/chat';

  const thread = document.getElementById('thread');
  const hero = document.getElementById('hero');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('sendBtn');

  const userIcon = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12Zm0 2c-3 0-9 1.5-9 4.5V21h18v-2.5c0-3-6-4.5-9-4.5Z" fill="currentColor"/></svg>`;
  const botIcon = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L14.2 9.2L21 12L14.2 14.8L12 22L9.8 14.8L3 12L9.8 9.2L12 2Z" fill="white"/></svg>`;

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', () => {
    autoGrow();
    sendBtn.disabled = input.value.trim().length === 0;
  });

  function scrollToBottom(){
    thread.scrollIntoView(false);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function removeHero(){
    if (hero) hero.remove();
  }

  function addMessage(role, text){
    removeHero();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const label = role === 'user' ? 'You' : role === 'assistant' ? 'Ask' : 'Error';
    msg.innerHTML = `
      <div class="avatar">${role === 'user' ? userIcon : botIcon}</div>
      <div class="bubble-col">
        <div class="role-label">${label}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>
    `;
    thread.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function addTyping(){
    removeHero();
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.id = 'typingMsg';
    msg.innerHTML = `
      <div class="avatar thinking">${botIcon}</div>
      <div class="bubble-col">
        <div class="role-label">Ask</div>
        <div class="bubble typing-dots"><span></span><span></span><span></span></div>
      </div>
    `;
    thread.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping(){
    const t = document.getElementById('typingMsg');
    if (t) t.remove();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function send(question){
    if (!question || !question.trim()) return;
    addMessage('user', question.trim());
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    input.disabled = true;
    addTyping();

    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question.trim() })
      });
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const data = await res.json();
      removeTyping();
      addMessage('assistant', data.answer ?? '(empty response)');
    } catch (err) {
      removeTyping();
      addMessage('error', `Couldn't reach the backend (${err.message}). Make sure the Spring Boot app is running and CORS is enabled.`);
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', () => send(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send(input.value);
    }
  });
  document.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => send(el.dataset.q));
  });
</script>

</body>
</html>
